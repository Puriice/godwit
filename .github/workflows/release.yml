name: Release

# Push a tag such as v0.1.0 to build binaries and publish a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...

  release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Release notes
        run: |
          prev=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          range="${prev:+$prev..}${GITHUB_REF_NAME}"
          git log --no-merges --pretty='%s' "$range" > commits.txt
          section() { # title, prefix regex
            lines=$(grep -E "^($2):" commits.txt | sed -E 's/^[^:]+:[[:space:]]*/- /' || true)
            [ -n "$lines" ] && printf '### %s\n%s\n\n' "$1" "$lines"
            return 0
          }
          {
            section Added Add
            section Changed Change
            section Fixed Fix
            section Removed Remove
            other=$(grep -vE '^(Add|Change|Fix|Remove):' commits.txt | sed 's/^/- /' || true)
            [ -n "$other" ] && printf '### Other\n%s\n\n' "$other"
            [ -n "$prev" ] && echo "**Full changelog**: https://github.com/${GITHUB_REPOSITORY}/compare/${prev}...${GITHUB_REF_NAME}"
          } > notes.md
          cat notes.md
      - name: Build
        run: |
          mkdir dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os=${target%/*}; arch=${target#*/}
            ext=""; [ "$os" = windows ] && ext=".exe"
            name="godwit_${GITHUB_REF_NAME}_${os}_${arch}"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags "-s -w" -o "dist/godwit$ext" ./cmd/godwit
            if [ "$os" = windows ]; then
              (cd dist && zip "$name.zip" godwit.exe)
            else
              tar -C dist -czf "dist/$name.tar.gz" godwit
            fi
            rm "dist/godwit$ext"
          done
          (cd dist && sha256sum * > checksums.txt)
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --notes-file notes.md --title "$GITHUB_REF_NAME"
